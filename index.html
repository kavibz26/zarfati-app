<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Habla! - לימוד ספרדית</title>
<link rel="stylesheet" href="css/style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ef4444">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">

<!-- iOS -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="¡Habla!">

<!-- Android / Chrome (legacy, לתאימות רחבה יותר) -->
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="homeBtn" class="brand" title="חזרה לדף הבית">
        <span class="brand-icon">🇪🇸</span>
        <span class="brand-name">¡Habla!</span>
      </button>
      <div id="breadcrumb" class="breadcrumb"></div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <p>אפליקציית לימוד ספרדית · 3 רמות קושי · ההתקדמות נשמרת אוטומטית במכשיר שלך</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <script>
    // רישום Service Worker לתמיכה אופליין - סקריפט נפרד, לא נוגע בלוגיקת הלמידה ב-app.js
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
